creation_rules:
  # one rule per host so no host decrypts another's secrets. no catch-all on purpose:
  # a file for an unlisted host fails closed
  - path_regex: secrets/mesa-svc-01\.yaml$
    key_groups:
      - age:
          - *user_tetra
          - *user_myputer
          - *host_mesa_svc_01
  - path_regex: secrets/mesa-svc-02\.yaml$
    key_groups:
      - age:
          - *user_tetra
