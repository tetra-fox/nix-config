name: Update flake inputs

on:
  schedule:
    - cron: "0 13 * * 2" # Tuesday at 13:00 UTC
  workflow_dispatch:

jobs:
  update-flake-inputs:
    name: Update flake inputs
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write # the bump lands as a PR, not a push to main
      actions: write # cache-nix-action purges stale nix-store caches

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update flake inputs
        run: nix flake update

      # opens a PR rather than pushing to main. flake.lock pins ~91 inputs, a good number
      # of them small personal repos and one self-hosted forge, and whatever lands here
      # gets run as root across the fleet on the next rebuild. a PR puts CI and a human
      # between an upstream compromise and that.
      # gh is preinstalled on the runner, so this adds no new action dependency, which
      # would be self-defeating for a supply-chain fix.
      - name: Open bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet HEAD -- flake.lock; then
            echo "flake.lock unchanged, nothing to propose"
            exit 0
          fi
          branch=flake-bump
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -B and --force so a rerun refreshes the existing branch (and its open PR)
          # instead of failing on a branch that is already there
          git checkout -B "$branch"
          git add flake.lock
          git commit -m "chore(flake): bump flake inputs"
          git push --force --set-upstream origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore(flake): bump flake inputs" \
              --body "Automated weekly \`nix flake update\`. Review the input diff before merging."
          else
            echo "PR already open for $branch, force-push refreshed it"
          fi
