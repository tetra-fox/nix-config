name: CI

on:
  pull_request:
  push:
    branches: [main]
  # update-flake.yml runs this against the bump commit before opening its PR.
  # on push and pull_request inputs.ref is empty, so checkout uses the event's commit
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # cache-nix-action purges stale nix-store caches

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # --inputs-from pins nixpkgs from flake.lock without evaluating the flake, so this
      # fetches one input instead of all of them and skips the ~8G devshell
      - run: nix shell --inputs-from . nixpkgs#alejandra nixpkgs#just -c just fmt-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix shell --inputs-from . nixpkgs#statix nixpkgs#deadnix nixpkgs#just -c just lint

  secrets-encrypted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix shell --inputs-from . nixpkgs#just nixpkgs#python3 -c just secrets-check

  fleet-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix shell --inputs-from . nixpkgs#just -c just fleet-test

  discover:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # darwin evals fine on linux. tests/default.nix stays the only place a test is named
      - id: list
        run: |
          nixos=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)
          darwin=$(nix eval --json .#darwinConfigurations --apply builtins.attrNames)
          echo "hosts=$(jq -cn --argjson n "$nixos" --argjson d "$darwin" \
            '[($n[] | "nixosConfigurations." + . + ".config.system.build.toplevel"),
              ($d[] | "darwinConfigurations." + . + ".system")]')" >> "$GITHUB_OUTPUT"
          echo "tests=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames \
            | jq -c .)" >> "$GITHUB_OUTPUT"

  eval:
    name: eval ${{ matrix.host }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.discover.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix eval --raw '.#${{ matrix.host }}.drvPath'

  # linux runners have kvm
  vm-test:
    name: vm-test ${{ matrix.test }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover.outputs.tests) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build .#checks.x86_64-linux.${{ matrix.test }} -L --no-link
