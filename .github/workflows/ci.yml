name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # cache-nix-action purges stale nix-store caches

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # tool set matches the devshell in flake.nix; --inputs-from resolves `nixpkgs`
      # to the root flake.lock's pinned rev without evaluating the flake, so this job
      # fetches one input instead of all of them (and never realises the ~8G devshell
      # closure)
      - run: nix shell --inputs-from . nixpkgs#alejandra nixpkgs#statix nixpkgs#just -c just fmt-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix shell --inputs-from . nixpkgs#alejandra nixpkgs#statix nixpkgs#just -c just lint

  # a plaintext secrets file would otherwise eval, build and commit cleanly: sops-nix's
  # validateSopsFiles hashes these files but never checks they are encrypted
  secrets-encrypted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix shell --inputs-from . nixpkgs#just nixpkgs#python3 -c just secrets-check

  # ensure fleet discovery remains generic
  fleet-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix shell --inputs-from . nixpkgs#just -c just fleet-test

  discover:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # both host classes, as full toplevel attr paths: darwin evals fine on
      # linux (eval is cross-platform) and auto-discovery means a new mac gets
      # CI coverage the same way a new server does.
      # the vm test list is derived the same way, so tests/default.nix stays the
      # only place a test is named and a new one cannot be added without CI
      - id: list
        run: |
          nixos=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)
          darwin=$(nix eval --json .#darwinConfigurations --apply builtins.attrNames)
          echo "hosts=$(jq -cn --argjson n "$nixos" --argjson d "$darwin" \
            '[($n[] | "nixosConfigurations." + . + ".config.system.build.toplevel"),
              ($d[] | "darwinConfigurations." + . + ".system")]')" >> "$GITHUB_OUTPUT"
          echo "tests=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames \
            | jq -c .)" >> "$GITHUB_OUTPUT"

  eval:
    name: eval ${{ matrix.host }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.discover.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix eval --raw '.#${{ matrix.host }}.drvPath'

  # runtime checks: VM tests of the failover claims (tests/). linux runners have kvm
  vm-test:
    name: vm-test ${{ matrix.test }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover.outputs.tests) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build .#checks.x86_64-linux.${{ matrix.test }} -L --no-link
