# bans on the request path at any status: some probes get a 200/302 off a real backend.
# no bare /login, /admin, /api, /wp-json, see the caddy README
# \.php is safe only because nothing behind this caddy serves php
[Definition]
# path only: stops at ?, so a probe reflected into /login?redirectTo=... doesn't match
failregex = ^<HOST> .*"(GET|POST|HEAD|PUT) [^"?]*(%(probe_paths)s)[^"?\s]*[ ?][^"]*" [0-9]+ [0-9]+$
            ^<HOST> .*"(GET|POST|HEAD|PUT) /(env|config|server)(?=[ ?"])[^"?\s]*[ ?][^"]*" [0-9]+ [0-9]+$

# /env /config /server belong in the second failregex, anchored to the path root.
# here the [^"?]* prefix matches them deep in real paths (/api/ios/config)
probe_paths = \.php|/wp-admin|/wp-content/|/wp-includes/|/wordpress/|/wp-json/gravitysmtp/|/\.env|/\.git/|/\.svn/|/\.hg/|/\.aws/credentials|/\.aws/config|/\.ssh/|/phpmyadmin|/phpMyAdmin|/pma/|/mysqladmin|/dbadmin/|/vendor/phpunit|/eval-stdin|/config\.php\.bak|/config\.env|/webshell|/cgi-bin/|/actuator/|/solr/|/console/|/manager/html|/HNAP1|/boaform/|/GponForm/|/setup\.cgi|/\.DS_Store|/backup\.sql|/dump\.sql|/database\.sql|/this_is_a_new_hello_world|/docker-compose|/terraform\.tf(vars|state)|/serverless\.ya?ml|/secrets\.ya?ml|/\.streamlit/secrets|/settings\.py|/\.flaskenv|/\.vultr-cli|/\.linode-cli|/\.config/hcloud|/\.config/linode|/server-status|/login\.action|/@vite/env|/trace\.axd|/debug/default/view|/___proxy_subdomain_cpanel

ignoreregex =
