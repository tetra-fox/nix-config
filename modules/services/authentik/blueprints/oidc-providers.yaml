version: 1
metadata:
  name: oidc-providers
entries:
  # the stock profile mapping's groups claim lists direct memberships only, so proxmox and
  # grafana would never see a group inherited through superadmin or sysadmin
  - model: authentik_providers_oauth2.scopemapping
    id: profile
    identifiers: { name: profile with inherited groups }
    attrs:
      scope_name: profile
      description: General Profile Information
      expression: |
        avatar = request.user.avatar
        return delete_none_values({
            "name": request.user.name,
            "given_name": ak_obj_attr(request.user, "given_name", "name"),
            "family_name": ak_obj_attr(request.user, "family_name"),
            "preferred_username": request.user.username,
            "nickname": request.user.username,
            "groups": [group.name for group in request.user.all_groups()],
            "picture": avatar if avatar and not avatar.startswith("data:") else None,
        })

  - model: authentik_providers_oauth2.scopemapping
    identifiers: { name: immich role }
    state: absent

  # every client here does an authorization code login. proxy providers reset their own
  # grant types and mappings on save, so they aren't listed. client secrets come from
  # authentik.env, see oidcClients in system.nix
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-grafana
    identifiers: { name: Provider for Grafana }
    attrs:
      authorization_flow: &authorization !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: &invalidation !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: Wn5qil44lN5vTsbO7qDzpjl34ZB0oK2tzD3UrOaE
      client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
      redirect_uris:
        - { matching_mode: strict, url: https://stats.mesa.tetra.cool/login/generic_oauth }
      logout_uri: https://stats.mesa.tetra.cool/logout
      logout_method: frontchannel
      grant_types: &grants [authorization_code, refresh_token]
      access_token_validity: &access-validity minutes=5
      refresh_token_threshold: &refresh-threshold hours=1
      # generated once through the api (10 years), the key itself stays out of the repo
      signing_key: &signing !Find [authentik_crypto.certificatekeypair, [name, oidc-signing]]
      # grafana logs in by preferred_username and email, and takes its role from entitlements
      property_mappings: &mappings
        - &scope-openid !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - &scope-profile !KeyOf profile
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-home-assistant
    identifiers: { name: Provider for Home Assistant }
    attrs:
      authorization_flow: *authorization
      invalidation_flow: *invalidation
      client_type: confidential
      client_id: XLkh5uHjvLlZEJJix2j5J7uKPexY7asZc439Eu5A
      client_secret: !Env HOME_ASSISTANT_OIDC_CLIENT_SECRET
      redirect_uris:
        - { matching_mode: strict, url: https://home.mesa.tetra.cool/auth/openid/callback }
        - { matching_mode: strict, url: https://192.168.10.5/auth/openid/callback }
      grant_types: *grants
      access_token_validity: *access-validity
      refresh_token_threshold: *refresh-threshold
      signing_key: *signing
      property_mappings: *mappings
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-proxmox-ve
    identifiers: { name: Provider for Proxmox VE }
    attrs:
      authorization_flow: *authorization
      invalidation_flow: *invalidation
      client_type: confidential
      client_id: 4GEjBmZiMxN9j6TTVKLne6KmRozYc08bPUzzkHSS
      client_secret: !Env PROXMOX_OIDC_CLIENT_SECRET
      redirect_uris:
        - { matching_mode: strict, url: https://pve.mesa.tetra.cool }
      grant_types: *grants
      access_token_validity: *access-validity
      refresh_token_threshold: *refresh-threshold
      signing_key: *signing
      # the realm reads preferred_username and groups only
      property_mappings: [*scope-openid, *scope-profile]
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-immich
    identifiers: { name: Provider for Immich }
    attrs:
      authorization_flow: *authorization
      invalidation_flow: *invalidation
      client_type: confidential
      client_id: 6Yn7cayRUwkkNHXKOWFHpMIjE7dr3RpAIsYLMsK4
      client_secret: !Env IMMICH_OIDC_CLIENT_SECRET
      redirect_uris:
        - { matching_mode: strict, url: https://immich.mesa.tetra.cool/auth/login }
        - { matching_mode: strict, url: https://immich.mesa.tetra.cool/user-settings }
        - { matching_mode: strict, url: "app.immich:///oauth-callback" }
      grant_types: *grants
      access_token_validity: *access-validity
      refresh_token_threshold: *refresh-threshold
      signing_key: *signing
      # immich keys accounts on email and takes its role from entitlements
      property_mappings: *mappings
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-bambuddy
    identifiers: { name: Provider for Bambuddy }
    attrs:
      authorization_flow: *authorization
      invalidation_flow: *invalidation
      client_type: confidential
      client_id: bambuddy
      client_secret: !Env BAMBUDDY_OIDC_CLIENT_SECRET
      redirect_uris:
        - { matching_mode: strict, url: https://bb.mesa.tetra.cool/api/v1/auth/oidc/callback }
      grant_types: *grants
      access_token_validity: *access-validity
      refresh_token_threshold: *refresh-threshold
      signing_key: *signing
      # bambuddy reads preferred_username and groups only
      property_mappings: [*scope-openid, *scope-profile]
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-reseek
    identifiers: { name: Provider for reseek }
    attrs:
      authorization_flow: *authorization
      invalidation_flow: *invalidation
      client_type: confidential
      client_id: reseek
      client_secret: !Env RESEEK_OIDC_CLIENT_SECRET
      redirect_uris:
        - { matching_mode: strict, url: https://reseek.mesa.tetra.cool/api/v0/auth/oidc/authentik/callback }
      # ends the reseek session when the authentik session ends
      logout_uri: https://reseek.mesa.tetra.cool/api/v0/auth/oidc/authentik/backchannel
      logout_method: backchannel
      grant_types: *grants
      access_token_validity: *access-validity
      refresh_token_threshold: *refresh-threshold
      signing_key: *signing
      # reseek reads preferred_username and groups only
      property_mappings: [*scope-openid, *scope-profile]

  # grafana's binding is in grafana-access.yaml
  - model: authentik_core.application
    id: app-grafana
    identifiers: { slug: grafana }
    attrs: { name: Grafana, group: puting, provider: !KeyOf provider-grafana }
  - model: authentik_core.application
    id: app-home-assistant
    identifiers: { slug: home-assistant }
    attrs: { name: Home Assistant, open_in_new_tab: true, provider: !KeyOf provider-home-assistant }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-home-assistant, group: !Find [authentik_core.group, [name, local_users]] }
    attrs: { order: 0 }
  - model: authentik_core.application
    id: app-proxmox-ve
    identifiers: { slug: proxmox-ve }
    attrs: { name: Proxmox VE, group: puting, provider: !KeyOf provider-proxmox-ve }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-proxmox-ve, group: !Find [authentik_core.group, [name, pve_viewer]] }
    attrs: { order: 0 }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-proxmox-ve, group: !Find [authentik_core.group, [name, sysadmin]] }
    attrs: { order: 1 }
  - model: authentik_core.application
    id: app-immich
    identifiers: { slug: immich }
    attrs: { name: Immich, group: Media, provider: !KeyOf provider-immich }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-immich, group: !Find [authentik_core.group, [name, immich_users]] }
    attrs: { order: 0 }
  - model: authentik_core.application
    id: app-bambuddy
    identifiers: { slug: bambuddy }
    attrs: { name: Bambuddy, provider: !KeyOf provider-bambuddy, meta_launch_url: https://bb.mesa.tetra.cool }
  # roles come from bambuddy's group mapping (hosts/mesa-svc-01/bambuddy.nix)
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-bambuddy, group: !Find [authentik_core.group, [name, sysadmin]] }
    attrs: { order: 0 }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-bambuddy, group: !Find [authentik_core.group, [name, printer_admin]] }
    attrs: { order: 1 }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-bambuddy, group: !Find [authentik_core.group, [name, local_users]] }
    attrs: { order: 2 }
  - model: authentik_core.application
    id: app-reseek
    identifiers: { slug: reseek }
    attrs: { name: reseek, group: stealing, provider: !KeyOf provider-reseek, meta_launch_url: https://reseek.mesa.tetra.cool }
  # roles come from reseek's group mapping (modules/services/arr-stack/reseek.nix)
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-reseek, group: !Find [authentik_core.group, [name, sysadmin]] }
    attrs: { order: 0 }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-reseek, group: !Find [authentik_core.group, [name, arr_users]] }
    attrs: { order: 1 }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf app-reseek, group: !Find [authentik_core.group, [name, local_users]] }
    attrs: { order: 2 }

  # roles inside an app, granted to groups. a client that asks for the entitlements scope
  # gets their names in the `roles` claim. sysadmin is the admin role across apps
  - model: authentik_core.applicationentitlement
    id: immich-admin
    identifiers: { app: !KeyOf app-immich, name: admin }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf immich-admin, group: !Find [authentik_core.group, [name, sysadmin]] }
    attrs: { order: 0 }
  # immich only applies a role claim of admin or user, anything else leaves the account as is
  - model: authentik_core.applicationentitlement
    id: immich-user
    identifiers: { app: !KeyOf app-immich, name: user }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf immich-user, group: !Find [authentik_core.group, [name, immich_users]] }
    attrs: { order: 0 }

  - model: authentik_core.applicationentitlement
    id: grafana-server-admin
    identifiers: { app: !KeyOf app-grafana, name: GrafanaAdmin }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf grafana-server-admin, group: !Find [authentik_core.group, [name, superadmin]] }
    attrs: { order: 0 }
  - model: authentik_core.applicationentitlement
    id: grafana-admin
    identifiers: { app: !KeyOf app-grafana, name: Admin }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf grafana-admin, group: !Find [authentik_core.group, [name, sysadmin]] }
    attrs: { order: 0 }
