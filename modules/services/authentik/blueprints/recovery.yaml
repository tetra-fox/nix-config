version: 1
metadata:
  name: recovery
entries:
  # an admin creates a single-use link for a user (users > create recovery link) and sends
  # it to them, the flow then runs as that user. no email, so the login page doesn't link here
  - model: authentik_flows.flow
    id: flow
    identifiers: { slug: recovery }
    attrs:
      name: Recovery
      title: Set a new password
      designation: recovery
      authentication: none

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !Find [authentik_stages_prompt.promptstage, [name, default-password-change-prompt]]
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, login-session]]
      order: 30

  - model: authentik_brands.brand
    identifiers: { default: true }
    attrs: { flow_recovery: !KeyOf flow }
