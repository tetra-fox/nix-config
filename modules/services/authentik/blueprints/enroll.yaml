version: 1
metadata:
  name: enroll
entries:
  - model: authentik_flows.flow
    identifiers: { slug: accept-invite }
    state: absent
  - model: authentik_flows.flow
    identifiers: { slug: register }
    state: absent
  - model: authentik_stages_invitation.invitationstage
    identifiers: { name: accept-invite-validate-invite }
    state: absent
  - model: authentik_stages_invitation.invitationstage
    identifiers: { name: register-invitation }
    state: absent
  - model: authentik_stages_redirect.redirectstage
    identifiers: { name: accept-invite-redirect }
    state: absent
  - model: authentik_stages_prompt.promptstage
    identifiers: { name: register-prompt }
    state: absent
  - model: authentik_stages_user_write.userwritestage
    identifiers: { name: resigter-user-write }
    state: absent

  - model: authentik_flows.flow
    id: flow
    identifiers: { slug: enroll }
    attrs:
      name: Enroll
      title: Create your account
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_stages_invitation.invitationstage
    id: invitation
    identifiers: { name: enroll-invitation }
    attrs:
      continue_flow_without_invitation: false

  - model: authentik_stages_prompt.prompt
    id: field-username
    identifiers: { name: enroll-field-username }
    attrs:
      {
        field_key: username,
        label: Username,
        type: username,
        required: true,
        placeholder: Username,
        order: 0,
      }
  - model: authentik_stages_prompt.prompt
    id: field-name
    identifiers: { name: enroll-field-name }
    attrs:
      {
        field_key: name,
        label: Name,
        type: text,
        required: true,
        placeholder: Name,
        order: 1,
      }
  - model: authentik_stages_prompt.prompt
    id: field-email
    identifiers: { name: enroll-field-email }
    attrs:
      {
        field_key: email,
        label: Email,
        type: email,
        required: true,
        placeholder: Email,
        order: 2,
      }
  - model: authentik_stages_prompt.prompt
    id: field-password
    identifiers: { name: enroll-field-password }
    attrs:
      {
        field_key: password,
        label: Password,
        type: password,
        required: true,
        placeholder: Password,
        order: 3,
      }
  - model: authentik_stages_prompt.prompt
    id: field-password-repeat
    identifiers: { name: enroll-field-password-repeat }
    attrs:
      {
        field_key: password_repeat,
        label: Password (repeat),
        type: password,
        required: true,
        placeholder: Password (repeat),
        order: 4,
      }

  - model: authentik_stages_prompt.promptstage
    id: prompt
    identifiers: { name: enroll-prompt }
    attrs:
      fields:
        - !KeyOf field-username
        - !KeyOf field-name
        - !KeyOf field-email
        - !KeyOf field-password
        - !KeyOf field-password-repeat
      # every validation policy has to pass, so only the password rules go here
      validation_policies:
        - !Find [
            authentik_policies_password.passwordpolicy,
            [name, default-password-change-password-policy],
          ]

  # internal, not external: external users are refused the user interface, so they could not
  # see their apps or change their password
  - model: authentik_stages_user_write.userwritestage
    id: write
    identifiers: { name: enroll-user-write }
    attrs:
      user_creation_mode: always_create
      user_type: internal
      create_users_group: !Find [authentik_core.group, [name, jellyfin_users]]

  - model: authentik_stages_user_login.userloginstage
    id: login
    identifiers: { name: enroll-login }

  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf flow, stage: !KeyOf invitation, order: 10 }
  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf flow, stage: !KeyOf prompt, order: 20 }
  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf flow, stage: !KeyOf write, order: 30 }
  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf flow, stage: !KeyOf login, order: 40 }
