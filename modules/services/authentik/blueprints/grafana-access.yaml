version: 1
metadata:
  name: grafana-access
entries:
  # an unbound app admits every user, and grafana signs anyone it is handed up as a Viewer
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, grafana]]
      group: !Find [authentik_core.group, [name, sysadmin]]
    attrs:
      order: 0
