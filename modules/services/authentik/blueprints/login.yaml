version: 1
metadata:
  name: login
entries:
  # replaces the stock authentication and invalidation flows, whose blueprints are
  # disabled by hand (see prune.yaml)

  # embedded in identification, never bound to the flow on its own. account.yaml sets its
  # configure_flow, the settings page's change password
  - model: authentik_stages_password.passwordstage
    id: password
    identifiers: { name: login-password }
    attrs:
      backends: [authentik.core.auth.InbuiltBackend]
      allow_show_password: true
      failed_attempts_before_cancel: 5

  # the 2fa methods. the method picker titles each with its stage name, and a new device
  # is called by friendly_name. each configure_flow is what the settings page runs to
  # add a device
  - model: authentik_flows.flow
    id: passkey-setup
    identifiers: { slug: passkey-setup }
    attrs:
      name: Set up a passkey
      title: Set up a passkey
      designation: stage_configuration
      authentication: require_authenticated
      layout: stacked
      compatibility_mode: true
  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    id: passkey
    identifiers: { name: Passkey }
    attrs:
      friendly_name: Passkey
      configure_flow: !KeyOf passkey-setup
      # discoverable, so it can sign in from the identification stage without a username
      resident_key_requirement: required
      user_verification: preferred
  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf passkey-setup, stage: !KeyOf passkey, order: 0 }

  - model: authentik_flows.flow
    id: totp-setup
    identifiers: { slug: authenticator-app-setup }
    attrs:
      name: Set up an authenticator app
      title: Set up an authenticator app
      designation: stage_configuration
      authentication: require_authenticated
      layout: stacked
      compatibility_mode: true
  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    id: totp
    identifiers: { name: Authenticator app }
    attrs:
      friendly_name: Authenticator app
      configure_flow: !KeyOf totp-setup
      digits: "6"
  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf totp-setup, stage: !KeyOf totp, order: 0 }

  # also the identification stage's passkey stage, and enroll and recovery bind it too.
  # a user with no device sets one up here, so every login ends with 2fa
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa
    identifiers: { name: login-mfa }
    attrs:
      # no static recovery codes, a locked out user gets an admin recovery link instead
      device_classes: [totp, webauthn]
      not_configured_action: configure
      configuration_stages: [!KeyOf passkey, !KeyOf totp]
      last_auth_threshold: minutes=1
      webauthn_user_verification: preferred

  # the login form's manual passkey button, for when the browser's passkey suggestion was
  # dismissed. no username comes first, so the passkey is the whole login and has to be
  # verified (biometric or pin)
  - model: authentik_flows.flow
    id: passkey-login
    identifiers: { slug: passkey-login }
    attrs:
      name: Log in with a passkey
      title: Log in with a passkey
      designation: authentication
      authentication: none
      layout: stacked
      compatibility_mode: true
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: passkey-validate
    identifiers: { name: passkey-login-validate }
    attrs:
      device_classes: [webauthn]
      not_configured_action: deny
      webauthn_user_verification: required

  - model: authentik_stages_identification.identificationstage
    id: identification
    identifiers: { name: login-identification }
    attrs:
      user_fields: [email, username]
      password_stage: !KeyOf password
      webauthn_stage: !KeyOf mfa
      passwordless_flow: !KeyOf passkey-login
      case_insensitive_matching: true
      show_matched_user: true
      pretend_user_exists: true
      enable_remember_me: true

  - model: authentik_stages_user_login.userloginstage
    id: session
    identifiers: { name: login-session }
    attrs:
      session_duration: hours=24
      remember_me_offset: days=30
      remember_device: days=30

  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf passkey-login, stage: !KeyOf passkey-validate, order: 10 }
  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf passkey-login, stage: !KeyOf session, order: 20 }

  - model: authentik_policies_expression.expressionpolicy
    id: mfa-unless-passkey
    identifiers: { name: login-mfa-unless-passkey }
    attrs:
      expression: |
        flow_plan = request.context.get("flow_plan")
        if not flow_plan:
            return True
        return flow_plan.context.get("auth_method") != "auth_webauthn_pwl"

  - model: authentik_flows.flow
    id: login
    identifiers: { slug: login }
    attrs:
      name: Log in
      title: Log in
      designation: authentication
      authentication: none
      layout: stacked
      compatibility_mode: true
      denied_action: message_continue

  # passes for an address whose failed logins brought its score down to the threshold,
  # so the binding is negated. by ip only: a username check would let anyone lock a user
  # out by guessing at their name. scores expire after AUTHENTIK_REPUTATION__EXPIRY
  - model: authentik_policies_reputation.reputationpolicy
    id: reputation
    identifiers: { name: login-reputation }
    attrs: { check_ip: true, check_username: false, threshold: -5 }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf login, policy: !KeyOf reputation, order: 0 }
    attrs: { negate: true }

  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf login, stage: !KeyOf identification, order: 10 }
  - model: authentik_flows.flowstagebinding
    id: mfa-binding
    identifiers: { target: !KeyOf login, stage: !KeyOf mfa, order: 20 }
    attrs: { re_evaluate_policies: true }
  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf login, stage: !KeyOf session, order: 30 }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf mfa-binding, policy: !KeyOf mfa-unless-passkey, order: 0 }
    attrs: { failure_result: true }

  - model: authentik_stages_user_logout.userlogoutstage
    id: logout-stage
    identifiers: { name: logout }

  - model: authentik_flows.flow
    id: logout
    identifiers: { slug: logout }
    attrs:
      name: Log out
      title: Log out
      designation: invalidation
      authentication: none
      layout: stacked
      compatibility_mode: true

  - model: authentik_flows.flowstagebinding
    identifiers: { target: !KeyOf logout, stage: !KeyOf logout-stage, order: 0 }

  # the page apps send people to after they log out of them. custom.css is written for
  # the compatibility mode render (shadydom), so every flow with a screen has it on
  - model: authentik_flows.flow
    identifiers: { slug: default-provider-invalidation-flow }
    attrs: { layout: stacked, compatibility_mode: true }

  # deleting a stage drops its flow bindings, so login and logout lose the stock stages
  # in the same transaction that binds the ones above
  - model: authentik_flows.flow
    identifiers: { slug: default-authentication-flow }
    state: absent
  - model: authentik_flows.flow
    identifiers: { slug: default-invalidation-flow }
    state: absent
  - model: authentik_stages_identification.identificationstage
    identifiers: { name: default-authentication-identification }
    state: absent
  - model: authentik_stages_password.passwordstage
    identifiers: { name: default-authentication-password }
    state: absent
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers: { name: default-authentication-mfa-validation }
    state: absent
  - model: authentik_stages_user_login.userloginstage
    identifiers: { name: default-authentication-login }
    state: absent
  - model: authentik_stages_user_logout.userlogoutstage
    identifiers: { name: default-invalidation-logout }
    state: absent
  - model: authentik_policies_expression.expressionpolicy
    identifiers: { name: default-authentication-flow-password-stage }
    state: absent
  - model: authentik_policies_expression.expressionpolicy
    identifiers: { name: default-authentication-flow-authenticator-validate-stage }
    state: absent
  # replaced by the passkey and authenticator app stages above. devices only reference
  # their user, so existing ones survive
  - model: authentik_flows.flow
    identifiers: { slug: default-authenticator-webauthn-setup }
    state: absent
  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    identifiers: { name: default-authenticator-webauthn-setup }
    state: absent
  - model: authentik_flows.flow
    identifiers: { slug: default-authenticator-totp-setup }
    state: absent
  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    identifiers: { name: default-authenticator-totp-setup }
    state: absent
